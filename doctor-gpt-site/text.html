<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Text Assistant | DoctorGPT</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background-color: #0d1117;
            margin: 0;
            font-family: "Segoe UI", sans-serif;
            color: #fff;
        }

        .header {
            text-align: center;
            padding: 30px 0 10px;
        }

        .header h1 {
            font-size: 42px;
            font-weight: 800;
            color: #4ea3ff;
            margin: 0;
        }

        .header p {
            font-size: 18px;
            opacity: 0.7;
        }

        #chat-container {
            width: 70%;
            margin: auto;
            background: #0f1521;
            border-radius: 18px;
            padding: 20px;
            height: 75vh;

            display: flex;
            flex-direction: column;

            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
        }

        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding-right: 10px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            margin: 12px 0;

            border-radius: 16px;

            font-size: 15px;
            line-height: 1.4;

            white-space: pre-wrap;
        }

        .user {
            background: #2979ff;
            align-self: flex-end;
            margin-left: auto;

            border-bottom-right-radius: 4px;
        }

        .ai {
            background: #1e2633;
            align-self: flex-start;

            border-bottom-left-radius: 4px;
            border-left: 3px solid #4ea3ff;
        }

        .typing {
            background: #1e2633;
            opacity: 0.7;

            font-style: italic;
            align-self: flex-start;
        }

        #chat-input-box {
            display: flex;
            margin-top: 10px;
            gap: 10px;
        }

        #user-input {
            flex: 1;

            padding: 14px;

            border-radius: 12px;
            border: none;
            outline: none;

            font-size: 16px;

            background: #1e2633;
            color: #fff;
        }

        #user-input::placeholder {
            color: #8b949e;
        }

        button {
            padding: 0 24px;

            background: #2979ff;

            border: none;
            border-radius: 12px;

            cursor: pointer;

            font-size: 18px;
            color: white;

            transition: 0.2s;
        }

        button:hover {
            background: #1a62d6;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Mobile */
        @media (max-width: 700px) {

            #chat-container {
                width: 90%;
                height: 75vh;
            }

            .header h1 {
                font-size: 32px;
            }

            .header p {
                font-size: 15px;
            }

            .message {
                max-width: 85%;
            }
        }
    </style>
</head>


<body>

    <div class="header">

        <h1>💬 Text Assistant</h1>

        <p>
            Ask anything — symptoms, advice, guidance, medical doubts
        </p>

    </div>


    <div id="chat-container">

        <div id="chat-box"></div>


        <div id="chat-input-box">

            <input
                id="user-input"
                type="text"
                placeholder="Type your message..."
                autocomplete="off"
            >

            <button
                id="send-btn"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

    </div>


    <script src="text.js"></script>

</body>

</html>
